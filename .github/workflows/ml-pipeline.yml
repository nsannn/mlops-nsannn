# .github/workflows/ml-pipeline.yml
# CI: lint -> test -> model-gate (dvc repro + gate) -> build-push (image + manifest bump).
# CI never connects to the cluster: the new image tag goes to Git and scripts/deploy.sh applies it.
name: ml-pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["k8s/**", "docs/**", "**.md"]   # bump commits, reverts and doc edits don't retrigger
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  model-gate:
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:////tmp/ci-mlflow.db  
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Raw data from the pinned Hugging Face revision, checked against the DVC pointer
        run: |
          python scripts/fetch_data.py
          test "$(md5sum data/raw/dataset.parquet | cut -c1-32)" = "$(awk '/md5:/ {print $NF}' data/raw/dataset.parquet.dvc)"
      - name: dvc repro (prepare -> train -> evaluate)
        run: dvc repro
      - name: Quality gate
        run: python scripts/check_model_gate.py
      - uses: actions/upload-artifact@v7
        if: always()                       # keep metrics.json for red runs too
        with: {name: metrics, path: metrics.json}

  build-push:
    needs: model-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}   # write: the bot commit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: metrics}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, scan (block CRITICAL), push
        run: |
          TAG=sha-${GITHUB_SHA::7}
          docker build -f docker/Dockerfile.api \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$API_IMAGE:$TAG" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 "$API_IMAGE:$TAG"
          docker push "$API_IMAGE:$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Update the manifest in Git
        run: |
          sed -i "s|image: ghcr.io/.*/api:.*|image: $API_IMAGE:$TAG|" k8s/api.yaml
          F1=$(python3 -c "import json; print(round(json.load(open('metrics.json'))['f1'], 4))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/api.yaml
          git diff --staged --quiet || git commit -m "ci: bump api to $TAG (gate f1=$F1)"
          git push
